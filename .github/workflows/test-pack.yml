# Public CI is synthetic/offline only. Never attach live credentials or Azure identities.
name: Test pack
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline pack and native contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./qa/Initialize-Tools.ps1
          Initialize-VbrOfflineTools
          . ./qa/Invoke-Offline.ps1
          . ./qa/Native.ps1
          $result = Invoke-VbrOfflineValidation
          Invoke-VbrNativeValidation -Bundle $result.Bundle
